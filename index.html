<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>A po pijmë një kafe?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: one centered "card" scene per step; the Jo button breaks out to position:fixed and runs around the whole screen. Single warm look on purpose. */
  :root {
    --bg: #ffd8e4;          /* strawberry milk */
    --bg-2: #ffc2d4;
    --ink: #3b1f14;         /* espresso */
    --ink-soft: #7a4a38;
    --po: #e8304a;          /* cherry */
    --po-ink: #fff6f2;
    --jo: #fff6f2;
    --card: #fff6f2;
    --line: #3b1f14;
    --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 20% 15%, var(--bg-2) 0 18%, transparent 19%),
                radial-gradient(circle at 85% 80%, var(--bg-2) 0 14%, transparent 15%),
                var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    overflow-x: hidden;
  }
  .stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 28px;
    box-shadow: 8px 8px 0 var(--line);
    padding: 32px 24px;
    box-sizing: border-box;
    display: grid;
    gap: 20px;
    text-align: center;
  }
  h1, h2 {
    font-family: var(--font-display);
    font-weight: 800;
    margin: 0;
    text-wrap: balance;
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  h1 { font-size: clamp(2.1rem, 8vw, 2.9rem); }
  h2 { font-size: clamp(1.6rem, 6vw, 2.1rem); }
  p { margin: 0; color: var(--ink-soft); line-height: 1.5; }
  .eyebrow {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--po);
  }

  /* Cup */
  .cup { width: 132px; height: 120px; margin: 0 auto; position: relative; }
  .cup svg { width: 100%; height: 100%; overflow: visible; }
  .steam path { animation: steam 2.6s ease-in-out infinite; transform-origin: center; }
  .steam path:nth-child(2) { animation-delay: .5s; }
  .steam path:nth-child(3) { animation-delay: 1s; }
  @keyframes steam { 0%,100% { opacity: .15; transform: translateY(4px); } 50% { opacity: .9; transform: translateY(-4px); } }

  /* Buttons */
  .choices { display: flex; justify-content: center; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; }
  .btn {
    font-family: var(--font-display);
    font-weight: 800;
    border: 3px solid var(--line);
    border-radius: 999px;
    padding: 12px 30px;
    font-size: 1.25rem;
    box-shadow: 4px 4px 0 var(--line);
    transition: transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--line); }
  .btn:focus-visible { outline: 3px dashed var(--po); outline-offset: 4px; }
  .btn-po { background: var(--po); color: var(--po-ink); font-size: calc(1.25rem * var(--grow, 1)); padding: calc(12px * var(--grow,1)) calc(30px * var(--grow,1)); transition: font-size .25s cubic-bezier(.3,1.6,.5,1), padding .25s cubic-bezier(.3,1.6,.5,1); }
  .btn-jo { background: var(--jo); color: var(--ink); white-space: nowrap; touch-action: none; }
  .btn-jo.loose { position: fixed; z-index: 50; transition: left .28s cubic-bezier(.3,1.4,.5,1), top .28s cubic-bezier(.3,1.4,.5,1); }
  .tease { min-height: 1.5em; font-weight: 500; color: var(--ink); }

  /* Form */
  form { display: grid; gap: 16px; text-align: left; }
  .field { display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row > * { min-width: 0; }
  label { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  input {
    font: inherit; font-size: 1.05rem; color: var(--ink);
    background: #fff; border: 2.5px solid var(--line); border-radius: 14px;
    padding: 12px 14px; width: 100%; box-sizing: border-box; min-width: 0;
  }
  input:focus-visible { outline: 3px solid var(--po); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 2px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font-size: .9rem; font-weight: 500;
  }
  .chip:hover, .chip[aria-pressed="true"] { background: var(--po); color: var(--po-ink); }
  .error { color: var(--po); font-weight: 700; font-size: .92rem; min-height: 1.2em; margin: 0; }
  .btn-wide { width: 100%; }

  /* Ticket */
  .ticket { display: grid; gap: 4px; border: 2.5px dashed var(--line); border-radius: 18px; padding: 16px; background: var(--bg); }
  .ticket .big { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; color: var(--ink); text-transform: capitalize; }
  .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .unit { border: 2.5px solid var(--line); border-radius: 14px; padding: 10px 4px; background: #fff; }
  .unit b { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 6vw, 1.9rem); font-variant-numeric: tabular-nums; }
  .unit span { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .actions { display: grid; gap: 10px; }
  .btn-ghost { background: var(--card); color: var(--ink); font-size: 1rem; }
  a.btn { text-decoration: none; display: block; }
  .msg { font-size: .9rem; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; color: var(--ink); user-select: all; white-space: pre-wrap; }
  .link-btn { background: none; border: none; color: var(--ink-soft); text-decoration: underline; font-size: .92rem; padding: 4px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; width: 100%; height: 100%; }
  .pop { animation: pop .45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
</style>

<canvas id="confetti" aria-hidden="true"></canvas>

<main class="stage">
  <!-- STEP 1: the question -->
  <section class="card pop" id="step-ask">
    <div class="cup" aria-hidden="true">
      <svg viewBox="0 0 132 120">
        <g class="steam" fill="none" stroke="#3b1f14" stroke-width="4" stroke-linecap="round">
          <path d="M40 30 q-8 -10 0 -20 q8 -10 0 -20"/>
          <path d="M62 30 q-8 -10 0 -20 q8 -10 0 -20"/>
          <path d="M84 30 q-8 -10 0 -20 q8 -10 0 -20"/>
        </g>
        <path d="M104 52 h8 a14 14 0 0 1 0 28 h-10" fill="none" stroke="#3b1f14" stroke-width="5"/>
        <path d="M16 40 h92 v34 a40 40 0 0 1 -40 40 h-12 a40 40 0 0 1 -40 -40 z" fill="#e8304a" stroke="#3b1f14" stroke-width="5" stroke-linejoin="round"/>
        <path d="M44 72 c0 -8 10 -12 14 -4 c4 -8 14 -4 14 4 c0 8 -14 16 -14 16 s-14 -8 -14 -16z" fill="#fff6f2"/>
      </svg>
    </div>
    <div>
      <p class="eyebrow">Ftesë zyrtare</p>
    </div>
    <h1>A po pijmë një kafe?</h1>
    <p class="tease" id="tease" aria-live="polite">Zgjedh me kujdes.</p>
    <div class="choices">
      <button class="btn btn-po" id="po" type="button">Po</button>
      <button class="btn btn-jo" id="jo" type="button">Jo</button>
    </div>
  </section>

  <!-- STEP 2: pick when & where -->
  <section class="card pop" id="step-plan" hidden>
    <p class="eyebrow">E dija! 🎉</p>
    <h2>Kur dhe ku?</h2>
    <p>Zgjedh ditën, orën dhe vendin. Unë vij me qejf.</p>
    <form id="plan" novalidate>
      <div class="row">
        <div class="field">
          <label for="date">Data</label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label for="time">Ora</label>
          <input type="time" id="time" value="18:00" required>
        </div>
      </div>
      <div class="field">
        <label for="place">Vendi</label>
        <input type="text" id="place" placeholder="p.sh. te kafja në qendër" maxlength="80" required>
        <div class="chips" id="chips">
          <button type="button" class="chip">Te kafja jote e preferuar</button>
          <button type="button" class="chip">Në qendër</button>
          <button type="button" class="chip">Diku me pamje</button>
          <button type="button" class="chip">Surprizë 😏</button>
        </div>
      </div>
      <p class="error" id="error" role="alert"></p>
      <button class="btn btn-po btn-wide" type="submit">E lamë ☕</button>
    </form>
  </section>

  <!-- STEP 3: the date + timer -->
  <section class="card pop" id="step-done" hidden>
    <p class="eyebrow">Takim i konfirmuar</p>
    <h2>Shihemi atëherë!</h2>
    <div class="ticket">
      <span class="big" id="t-date"></span>
      <span><b id="t-time"></b> · <span id="t-place"></span></span>
    </div>
    <div class="countdown" aria-live="off">
      <div class="unit"><b id="cd-d">0</b><span>ditë</span></div>
      <div class="unit"><b id="cd-h">00</b><span>orë</span></div>
      <div class="unit"><b id="cd-m">00</b><span>min</span></div>
      <div class="unit"><b id="cd-s">00</b><span>sek</span></div>
    </div>
    <p id="cd-note">Deri në kafe.</p>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <a class="btn btn-po" id="wa" href="#" target="_blank" rel="noopener">Dërgoje në WhatsApp</a>
      <button class="btn btn-ghost" id="copy" type="button">Kopjo mesazhin</button>
      <button class="link-btn" id="edit" type="button">Ndrysho datën ose vendin</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const po = $("po"), jo = $("jo"), tease = $("tease");

  /* ---------- STEP 1: the runaway "Jo" ---------- */
  const lines = [
    "Hmm, sigurt?",
    "Mendohu edhe një herë.",
    "Butoni Jo nuk punon sot.",
    "Po shoh që po rritet Po-ja…",
    "Kafja është falas, s'ke arsye.",
    "Jo-ja ka ikë me pushime.",
    "Ok, tash vetëm Po ka mbet.",
    "Ti e di që do të thuash Po 😄",
  ];
  const joLabels = ["Jo", "Sigurt?", "Jo 🥲", "Hmm…", "Kurrë?", "Prit…", "Jo?"];
  let tries = 0;

  function overlapsPo(x, y, w, h) {
    const r = po.getBoundingClientRect(), pad = 16;
    return !(x + w < r.left - pad || x > r.right + pad || y + h < r.top - pad || y > r.bottom + pad);
  }

  function runAway(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    tries++;
    tease.textContent = lines[Math.min(tries - 1, lines.length - 1)];
    jo.textContent = joLabels[tries % joLabels.length];
    po.style.setProperty("--grow", Math.min(1 + tries * 0.22, 3.4).toFixed(2));

    const rect = jo.getBoundingClientRect();
    if (!jo.classList.contains("loose")) {
      jo.style.left = rect.left + "px";
      jo.style.top = rect.top + "px";
      jo.classList.add("loose");
      void jo.offsetWidth; // commit start position so the jump animates
    }
    const w = jo.offsetWidth, h = jo.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight, m = 16;
    let x, y, n = 0;
    do {
      x = m + Math.random() * Math.max(0, vw - w - 2 * m);
      y = m + Math.random() * Math.max(0, vh - h - 2 * m);
      n++;
    } while ((overlapsPo(x, y, w, h) || Math.hypot(x - rect.left, y - rect.top) < 90) && n < 40);
    jo.style.left = x + "px";
    jo.style.top = y + "px";
  }

  // Mouse: dodge before it can be clicked. Touch/pen/keyboard: dodge on press.
  jo.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") runAway(e); });
  jo.addEventListener("pointerdown", runAway);
  jo.addEventListener("click", runAway);
  jo.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") runAway(e); });
  window.addEventListener("resize", () => {
    if (!jo.classList.contains("loose")) return;
    const r = jo.getBoundingClientRect();
    if (r.right > innerWidth || r.bottom > innerHeight) runAway();
  });

  po.addEventListener("click", () => {
    confetti();
    jo.hidden = true;
    show("step-plan");
    $("date").focus({ preventScroll: true });
  });

  /* ---------- STEP 2: plan ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const toISODate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = new Date();
  const tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  $("date").min = toISODate(today);
  $("date").value = toISODate(tomorrow);

  $("chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    $("place").value = chip.textContent.trim();
    [...$("chips").children].forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
  });

  let when = null, place = "";
  $("plan").addEventListener("submit", (e) => {
    e.preventDefault();
    const d = $("date").value, t = $("time").value;
    place = $("place").value.trim();
    if (!d || !t) return err("Zgjedh datën dhe orën.");
    if (!place) return err("Shkruaj vendin ku takohemi.");
    const [Y, M, D] = d.split("-").map(Number), [hh, mm] = t.split(":").map(Number);
    when = new Date(Y, M - 1, D, hh, mm);
    if (when <= new Date()) return err("Ajo kohë ka kaluar. Zgjedh një kohë më vonë.");
    err("");
    notify();
    renderTicket();
    confetti();
    show("step-done");
  });
  function err(text) { $("error").textContent = text; return false; }

  /* Email me: n8n webhook sends the email. Form-encoded = simple CORS request, no preflight. */
  const WEBHOOK = "https://n8n.gezimm.com/webhook/kafe-date";
  function notify() {
    const body = new URLSearchParams({
      answer: "Po",
      date: $("date").value,
      time: $("time").value,
      place,
      dateText: fmtDate(when),
      triesOnJo: String(tries),
      sentAt: new Date().toISOString(),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
    });
    try { fetch(WEBHOOK, { method: "POST", body, keepalive: true, mode: "no-cors" }).catch(() => {}); } catch {}
  }

  /* ---------- STEP 3: ticket + countdown ---------- */
  let timer = null;
  function fmtDate(d) {
    try { return d.toLocaleDateString("sq-AL", { weekday: "long", day: "numeric", month: "long" }); }
    catch { return d.toDateString(); }
  }
  function renderTicket() {
    const dateText = fmtDate(when);
    const timeText = `ora ${pad(when.getHours())}:${pad(when.getMinutes())}`;
    $("t-date").textContent = dateText;
    $("t-time").textContent = timeText;
    $("t-place").textContent = place;
    const text = `Po! ☕ E lamë për kafe: ${dateText}, ${timeText}, ${place}. Shihemi!`;
    $("msg").textContent = text;
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(text);
    clearInterval(timer);
    tick();
    timer = setInterval(tick, 1000);
  }
  function tick() {
    let s = Math.max(0, Math.floor((when - new Date()) / 1000));
    if (s === 0) { $("cd-note").textContent = "Ka ardhë koha. Kafja të pret! ☕"; clearInterval(timer); }
    $("cd-d").textContent = Math.floor(s / 86400); s %= 86400;
    $("cd-h").textContent = pad(Math.floor(s / 3600)); s %= 3600;
    $("cd-m").textContent = pad(Math.floor(s / 60));
    $("cd-s").textContent = pad(s % 60);
  }
  $("copy").addEventListener("click", () => {
    const text = $("msg").textContent, btn = $("copy");
    const done = () => { btn.textContent = "U kopjua ✓"; setTimeout(() => (btn.textContent = "Kopjo mesazhin"), 1800); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents($("msg"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = "Mesazhi u zgjodh, kopjoje vetë";
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
  });
  $("edit").addEventListener("click", () => { clearInterval(timer); show("step-plan"); });

  function show(id) {
    ["step-ask", "step-plan", "step-done"].forEach((s) => ($(s).hidden = s !== id));
    const el = $(id); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    window.scrollTo({ top: 0 });
  }

  /* ---------- confetti ---------- */
  const cv = $("confetti"), ctx = cv.getContext("2d");
  let bits = [], raf = null;
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const dpr = devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ["#e8304a", "#3b1f14", "#fff6f2", "#ff8fab", "#c98a5a"];
    for (let i = 0; i < 140; i++) bits.push({
      x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45,
      vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4,
      r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .3,
      c: colors[i % colors.length], life: 0,
    });
    if (!raf) loop();
  }
  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits = bits.filter((b) => b.life < 180 && b.y < innerHeight + 20);
    for (const b of bits) {
      b.vy += .32; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.a += b.va; b.life++;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
      ctx.fillStyle = b.c; ctx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2);
      ctx.restore();
    }
    raf = bits.length ? requestAnimationFrame(loop) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
  }
})();
</script>

</body>
</html>
